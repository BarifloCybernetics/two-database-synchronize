# ==============================================================================
# PostgreSQL 16 Configuration - Node A (Active-Active Replica)
# ==============================================================================

# ------------------------------------------------------------------------------
# CONNECTIONS AND NETWORKING
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
hba_file = '/etc/postgresql/pg_hba.conf'

# ------------------------------------------------------------------------------
# RESOURCE USAGE (MEMORY & BUFFERS)
# ------------------------------------------------------------------------------
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 2

# ------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL) & LOGICAL REPLICATION
# ------------------------------------------------------------------------------
wal_level = logical
max_wal_size = 2GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
wal_keep_size = 1024MB

# Send & receive replication workers
max_wal_senders = 16
max_replication_slots = 16
max_logical_replication_workers = 16
max_sync_workers_per_subscription = 4

# Commit timestamp tracking for conflict detection & resolution
track_commit_timestamp = on

# ------------------------------------------------------------------------------
# QUERY TUNING & EXTENSIONS
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_activity_query_size = 2048
track_io_timing = on

# ------------------------------------------------------------------------------
# LOGGING CONFIGURATION
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d [Node-A] '
log_timezone = 'UTC'
log_statement = 'ddl'
log_replication_commands = on
log_duration = off
log_lock_waits = on
log_temp_files = 0
