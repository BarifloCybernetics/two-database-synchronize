# ==============================================================================
# PostgreSQL Host-Based Authentication (pg_hba.conf) - Node A
# Multi-Network & Cross-Static-IP Access Configuration
# ==============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Docker internal bridge network connections (for exporters & local services):
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Logical Replication connections:
# Dedicated replicator user from any external / remote static IP with SCRAM password
host    replication     replicator      0.0.0.0/0               scram-sha-256
host    replication     replicator      ::0/0                   scram-sha-256

# Application & Cross-Node FDW queries from remote static IP:
host    appdb           replicator      0.0.0.0/0               scram-sha-256
host    appdb           postgres        0.0.0.0/0               scram-sha-256

# General database access with password:
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::0/0                   scram-sha-256
