# ==============================================================================
# Prometheus Configuration - PostgreSQL Active-Active Cluster
# Supports Single-Host Docker Network & Multi-Site Static IP Deployments
# ==============================================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'postgres-active-active'
    environment: 'production'

rule_files:
  - 'alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres-node-a'
    scrape_interval: 5s
    static_configs:
      # If running on separate servers across different networks,
      # replace 'postgres-exporter-a:9187' with Node A's static IP: e.g. '192.168.1.10:9187'
      - targets: ['postgres-exporter-a:9187']
        labels:
          node: 'node-a'
          role: 'active'
          instance_type: 'primary-replica'

  - job_name: 'postgres-node-b'
    scrape_interval: 5s
    static_configs:
      # If running on separate servers across different networks,
      # replace 'postgres-exporter-b:9187' with Node B's static IP: e.g. '192.168.2.20:9187'
      - targets: ['postgres-exporter-b:9187']
        labels:
          node: 'node-b'
          role: 'active'
          instance_type: 'primary-replica'
